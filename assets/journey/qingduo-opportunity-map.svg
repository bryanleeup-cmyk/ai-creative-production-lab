<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.5" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.11"/>
    </filter>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:850;fill:#101828}
      .text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#344054}
      .muted{fill:#667085}
      .head{font-size:22px;font-weight:800;fill:#fff}
      .cellTitle{font-size:22px;font-weight:850;fill:#101828}
      .cellText{font-size:18px;font-weight:620;fill:#475467}
      .tag{font-size:17px;font-weight:800}
      .num{font-size:18px;font-weight:850;fill:#fff}
      .small{font-size:17px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg2)"/>
  <circle cx="1340" cy="120" r="230" fill="#dbeafe" opacity="0.55"/>
  <circle cx="210" cy="850" r="260" fill="#e0e7ff" opacity="0.55"/>

  <text x="72" y="80" class="title" font-size="44">痛点 → 设计机会点 → 设计亮点归因图</text>
  <text x="72" y="120" class="text" font-size="22" font-weight="650">只选择体验设计能够解决的问题，把 2.0 卡点逐一对齐到 3.0 的设计动作</text>
  <rect x="1130" y="52" width="390" height="58" rx="20" fill="#101828"/>
  <text x="1325" y="88" text-anchor="middle" class="head">作品集表达原则：痛点必须能接到方案</text>

  <!-- column heads -->
  <g transform="translate(72,166)">
    <rect x="0" y="0" width="300" height="64" rx="20" fill="#f97316"/>
    <rect x="385" y="0" width="300" height="64" rx="20" fill="#64748b"/>
    <rect x="770" y="0" width="300" height="64" rx="20" fill="#2563eb"/>
    <rect x="1155" y="0" width="300" height="64" rx="20" fill="#111827"/>
    <text x="150" y="40" text-anchor="middle" class="head">2.0 可解决卡点</text>
    <text x="535" y="40" text-anchor="middle" class="head">设计机会点</text>
    <text x="920" y="40" text-anchor="middle" class="head">3.0 设计动作</text>
    <text x="1305" y="40" text-anchor="middle" class="head">作品集可讲亮点</text>
  </g>

  <!-- row helper arrows -->
  <g stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M386 304 H456"/>
    <path d="M771 304 H841"/>
    <path d="M1156 304 H1226"/>
    <path d="M386 446 H456"/>
    <path d="M771 446 H841"/>
    <path d="M1156 446 H1226"/>
    <path d="M386 588 H456"/>
    <path d="M771 588 H841"/>
    <path d="M1156 588 H1226"/>
    <path d="M386 730 H456"/>
    <path d="M771 730 H841"/>
    <path d="M1156 730 H1226"/>
    <path d="M386 872 H456"/>
    <path d="M771 872 H841"/>
    <path d="M1156 872 H1226"/>
  </g>
  <g fill="#cbd5e1">
    <polygon points="456,304 444,296 444,312"/>
    <polygon points="841,304 829,296 829,312"/>
    <polygon points="1226,304 1214,296 1214,312"/>
    <polygon points="456,446 444,438 444,454"/>
    <polygon points="841,446 829,438 829,454"/>
    <polygon points="1226,446 1214,438 1214,454"/>
    <polygon points="456,588 444,580 444,596"/>
    <polygon points="841,588 829,580 829,596"/>
    <polygon points="1226,588 1214,580 1214,596"/>
    <polygon points="456,730 444,722 444,738"/>
    <polygon points="841,730 829,722 829,738"/>
    <polygon points="1226,730 1214,722 1214,738"/>
    <polygon points="456,872 444,864 444,880"/>
    <polygon points="841,872 829,864 829,880"/>
    <polygon points="1226,872 1214,864 1214,880"/>
  </g>

  <!-- reusable row backgrounds -->
  <g filter="url(#shadow2)">
    <rect x="72" y="252" width="300" height="112" rx="22" fill="#fff7ed"/>
    <rect x="457" y="252" width="300" height="112" rx="22" fill="#ffffff"/>
    <rect x="842" y="252" width="300" height="112" rx="22" fill="#eff6ff"/>
    <rect x="1227" y="252" width="300" height="112" rx="22" fill="#ffffff"/>

    <rect x="72" y="394" width="300" height="112" rx="22" fill="#fff7ed"/>
    <rect x="457" y="394" width="300" height="112" rx="22" fill="#ffffff"/>
    <rect x="842" y="394" width="300" height="112" rx="22" fill="#eff6ff"/>
    <rect x="1227" y="394" width="300" height="112" rx="22" fill="#ffffff"/>

    <rect x="72" y="536" width="300" height="112" rx="22" fill="#fff7ed"/>
    <rect x="457" y="536" width="300" height="112" rx="22" fill="#ffffff"/>
    <rect x="842" y="536" width="300" height="112" rx="22" fill="#eff6ff"/>
    <rect x="1227" y="536" width="300" height="112" rx="22" fill="#ffffff"/>

    <rect x="72" y="678" width="300" height="112" rx="22" fill="#fff7ed"/>
    <rect x="457" y="678" width="300" height="112" rx="22" fill="#ffffff"/>
    <rect x="842" y="678" width="300" height="112" rx="22" fill="#eff6ff"/>
    <rect x="1227" y="678" width="300" height="112" rx="22" fill="#ffffff"/>

    <rect x="72" y="820" width="300" height="112" rx="22" fill="#fff7ed"/>
    <rect x="457" y="820" width="300" height="112" rx="22" fill="#ffffff"/>
    <rect x="842" y="820" width="300" height="112" rx="22" fill="#eff6ff"/>
    <rect x="1227" y="820" width="300" height="112" rx="22" fill="#ffffff"/>
  </g>

  <!-- row numbers -->
  <g>
    <circle cx="98" cy="278" r="16" fill="#f97316"/><text x="98" y="284" text-anchor="middle" class="num">1</text>
    <circle cx="98" cy="420" r="16" fill="#f97316"/><text x="98" y="426" text-anchor="middle" class="num">2</text>
    <circle cx="98" cy="562" r="16" fill="#f97316"/><text x="98" y="568" text-anchor="middle" class="num">3</text>
    <circle cx="98" cy="704" r="16" fill="#f97316"/><text x="98" y="710" text-anchor="middle" class="num">4</text>
    <circle cx="98" cy="846" r="16" fill="#f97316"/><text x="98" y="852" text-anchor="middle" class="num">5</text>
  </g>

  <!-- row 1 -->
  <text x="124" y="284" class="cellTitle">不知道从哪开始</text>
  <text x="124" y="316" class="cellText">工具多，用户先判断工具，</text>
  <text x="124" y="342" class="cellText">再反推任务路径。</text>
  <text x="485" y="284" class="cellTitle">入口目标化</text>
  <text x="485" y="316" class="cellText">先承接营销目标，</text>
  <text x="485" y="342" class="cellText">再分发合适能力。</text>
  <text x="870" y="284" class="cellTitle">超级输入框 + 高频入口</text>
  <text x="870" y="316" class="cellText">自然语言启动任务，</text>
  <text x="870" y="342" class="cellText">保留熟悉入口直达。</text>
  <text x="1255" y="284" class="cellTitle">平台入口升级</text>
  <text x="1255" y="316" class="cellText">从“找工具”切到</text>
  <text x="1255" y="342" class="cellText">“表达任务”。</text>

  <!-- row 2 -->
  <text x="124" y="426" class="cellTitle">信息表达不完整</text>
  <text x="124" y="458" class="cellText">字段、素材、比例、风格</text>
  <text x="124" y="484" class="cellText">都要用户自己理解。</text>
  <text x="485" y="426" class="cellTitle">输入与理解提质</text>
  <text x="485" y="458" class="cellText">把模糊表达补成</text>
  <text x="485" y="484" class="cellText">模型可执行任务。</text>
  <text x="870" y="426" class="cellTitle">智能标签 + Skill 补全</text>
  <text x="870" y="458" class="cellText">补行业、主体、卖点、</text>
  <text x="870" y="484" class="cellText">风格和风险边界。</text>
  <text x="1255" y="426" class="cellTitle">图片 Agent 提质</text>
  <text x="1255" y="458" class="cellText">把广告生产经验</text>
  <text x="1255" y="484" class="cellText">整理成能力包。</text>

  <!-- row 3 -->
  <text x="124" y="568" class="cellTitle">结果质量难判断</text>
  <text x="124" y="600" class="cellText">生成后靠经验判断</text>
  <text x="124" y="626" class="cellText">能不能投放。</text>
  <text x="485" y="568" class="cellTitle">质量标准显性化</text>
  <text x="485" y="600" class="cellText">把可用性拆成</text>
  <text x="485" y="626" class="cellText">可检查的质量约束。</text>
  <text x="870" y="568" class="cellTitle">六类质量约束</text>
  <text x="870" y="600" class="cellText">内容、主体、行业、</text>
  <text x="870" y="626" class="cellText">营销、合规、续改。</text>
  <text x="1255" y="568" class="cellTitle">生产质量设计</text>
  <text x="1255" y="600" class="cellText">把 38% 基线转成</text>
  <text x="1255" y="626" class="cellText">可行动的设计约束。</text>

  <!-- row 4 -->
  <text x="124" y="710" class="cellTitle">不满意后断链</text>
  <text x="124" y="742" class="cellText">用户要重新找编辑、</text>
  <text x="124" y="768" class="cellText">扩图、抠图等入口。</text>
  <text x="485" y="710" class="cellTitle">续改近场化</text>
  <text x="485" y="742" class="cellText">把不满意拆成</text>
  <text x="485" y="768" class="cellText">下一步生产动作。</text>
  <text x="870" y="710" class="cellTitle">结果页续改枢纽</text>
  <text x="870" y="742" class="cellText">再生成、扩图、抠图、</text>
  <text x="870" y="768" class="cellText">编辑、图转视频。</text>
  <text x="1255" y="710" class="cellTitle">链路连续设计</text>
  <text x="1255" y="742" class="cellText">让生成结果继续</text>
  <text x="1255" y="768" class="cellText">被修改和交付。</text>

  <!-- row 5 -->
  <text x="124" y="852" class="cellTitle">结果难沉淀复用</text>
  <text x="124" y="884" class="cellText">一次生成后，设置、</text>
  <text x="124" y="910" class="cellText">素材和经验容易丢失。</text>
  <text x="485" y="852" class="cellTitle">资产闭环化</text>
  <text x="485" y="884" class="cellText">让好结果进入资产，</text>
  <text x="485" y="910" class="cellText">被后续任务复用。</text>
  <text x="870" y="852" class="cellTitle">保存资产 + 历史带入</text>
  <text x="870" y="884" class="cellText">保留设置、素材、结果，</text>
  <text x="870" y="910" class="cellText">支持复用到新任务。</text>
  <text x="1255" y="852" class="cellTitle">从生成到生产</text>
  <text x="1255" y="884" class="cellText">把单次出图变成</text>
  <text x="1255" y="910" class="cellText">持续广告生产。</text>

  <!-- bottom summary -->
  <rect x="72" y="952" width="1455" height="34" rx="17" fill="url(#blue)" opacity="0.95"/>
  <text x="800" y="975" text-anchor="middle" class="font" font-size="18" font-weight="850" fill="#ffffff">归因逻辑：只把设计能解决的卡点写成痛点，每个痛点都对应到一个真实设计动作和一个作品集亮点。</text>
</svg>
