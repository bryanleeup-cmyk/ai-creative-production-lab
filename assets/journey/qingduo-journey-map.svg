<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="0.55" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-weight:800;fill:#101828}
      .text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#344054}
      .muted{fill:#667085}
      .small{font-size:20px}
      .body{font-size:22px;font-weight:600}
      .caption{font-size:18px}
      .stage{font-size:24px;font-weight:800;fill:#fff}
      .label{font-size:24px;font-weight:800}
      .tag{font-size:18px;font-weight:700}
      .cardTitle{font-size:22px;font-weight:800;fill:#101828}
      .cardText{font-size:19px;font-weight:600;fill:#475467}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1370" cy="120" r="220" fill="#dbeafe" opacity="0.5"/>
  <circle cx="250" cy="880" r="260" fill="#e0e7ff" opacity="0.55"/>

  <text x="72" y="82" class="title" font-size="44">擎舵 2.0 → 3.0 用户体验地图</text>
  <text x="72" y="122" class="text body">同一用户目标：从营销目标 / 商品素材出发，产出一版可投放的广告创意图，并完成续改、保存与复用</text>
  <rect x="1210" y="58" rx="18" ry="18" width="300" height="52" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1240" y="91" class="text tag" fill="#2563eb">同一主流程对齐，不做无效对比</text>

  <!-- stage header -->
  <g transform="translate(280,162)">
    <rect x="0" y="0" width="220" height="58" rx="18" fill="#2563eb"/>
    <rect x="255" y="0" width="220" height="58" rx="18" fill="#3b82f6"/>
    <rect x="510" y="0" width="220" height="58" rx="18" fill="#4f46e5"/>
    <rect x="765" y="0" width="220" height="58" rx="18" fill="#6366f1"/>
    <rect x="1020" y="0" width="220" height="58" rx="18" fill="#7c3aed"/>
    <text x="110" y="38" text-anchor="middle" class="stage">1 创作启动</text>
    <text x="365" y="38" text-anchor="middle" class="stage">2 信息补全</text>
    <text x="620" y="38" text-anchor="middle" class="stage">3 生成首版</text>
    <text x="875" y="38" text-anchor="middle" class="stage">4 质量判断</text>
    <text x="1130" y="38" text-anchor="middle" class="stage">5 续改交付</text>
  </g>

  <!-- lane labels -->
  <g>
    <rect x="72" y="250" width="170" height="178" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="157" y="305" text-anchor="middle" class="label" fill="#c2410c">擎舵 2.0</text>
    <text x="157" y="342" text-anchor="middle" class="text small" fill="#9a3412">工具集合</text>
    <text x="157" y="376" text-anchor="middle" class="text small" fill="#9a3412">用户自己找路</text>
    <rect x="72" y="590" width="170" height="188" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="157" y="650" text-anchor="middle" class="label" fill="#1d4ed8">擎舵 3.0</text>
    <text x="157" y="687" text-anchor="middle" class="text small" fill="#1e40af">Agent 任务流</text>
    <text x="157" y="721" text-anchor="middle" class="text small" fill="#1e40af">系统带用户推进</text>
  </g>

  <!-- before cards -->
  <g filter="url(#shadow)">
    <rect x="280" y="250" width="220" height="178" rx="24" fill="#ffffff"/>
    <rect x="535" y="250" width="220" height="178" rx="24" fill="#ffffff"/>
    <rect x="790" y="250" width="220" height="178" rx="24" fill="#ffffff"/>
    <rect x="1045" y="250" width="220" height="178" rx="24" fill="#ffffff"/>
    <rect x="1300" y="250" width="220" height="178" rx="24" fill="#ffffff"/>
  </g>
  <g>
    <text x="306" y="292" class="cardTitle">找工具入口</text>
    <text x="306" y="329" class="cardText">在一键出图、成片、</text>
    <text x="306" y="358" class="cardText">编辑器之间判断</text>
    <text x="306" y="396" class="tag" fill="#ef4444">卡点：不知道从哪开始</text>

    <text x="561" y="292" class="cardTitle">自己补信息</text>
    <text x="561" y="329" class="cardText">手动理解脚本、比例、</text>
    <text x="561" y="358" class="cardText">素材、落地页等字段</text>
    <text x="561" y="396" class="tag" fill="#ef4444">卡点：表达质量不稳定</text>

    <text x="816" y="292" class="cardTitle">等待一次生成</text>
    <text x="816" y="329" class="cardText">生成状态与后续动作</text>
    <text x="816" y="358" class="cardText">不在同一上下文</text>
    <text x="816" y="396" class="tag" fill="#ef4444">卡点：预期弱，容易断</text>

    <text x="1071" y="292" class="cardTitle">凭经验判断</text>
    <text x="1071" y="329" class="cardText">看主体、文案、行业、</text>
    <text x="1071" y="358" class="cardText">合规是否能投放</text>
    <text x="1071" y="396" class="tag" fill="#ef4444">卡点：质量标准不显性</text>

    <text x="1326" y="292" class="cardTitle">重新找续改入口</text>
    <text x="1326" y="329" class="cardText">扩图、抠图、编辑、</text>
    <text x="1326" y="358" class="cardText">转视频分散在各处</text>
    <text x="1326" y="396" class="tag" fill="#ef4444">卡点：容易重新开始</text>
  </g>

  <!-- after cards -->
  <g filter="url(#shadow)">
    <rect x="280" y="590" width="220" height="188" rx="24" fill="#ffffff"/>
    <rect x="535" y="590" width="220" height="188" rx="24" fill="#ffffff"/>
    <rect x="790" y="590" width="220" height="188" rx="24" fill="#ffffff"/>
    <rect x="1045" y="590" width="220" height="188" rx="24" fill="#ffffff"/>
    <rect x="1300" y="590" width="220" height="188" rx="24" fill="#ffffff"/>
  </g>
  <g>
    <text x="306" y="632" class="cardTitle">超级输入框</text>
    <text x="306" y="669" class="cardText">用户先表达营销目标，</text>
    <text x="306" y="698" class="cardText">系统再匹配能力</text>
    <text x="306" y="740" class="tag" fill="#2563eb">设计：从找工具到表达任务</text>

    <text x="561" y="632" class="cardTitle">Agent 补全</text>
    <text x="561" y="669" class="cardText">补行业、主体、卖点、</text>
    <text x="561" y="698" class="cardText">风格、风险边界</text>
    <text x="561" y="740" class="tag" fill="#2563eb">设计：把模糊输入变清楚</text>

    <text x="816" y="632" class="cardTitle">任务页承接</text>
    <text x="816" y="669" class="cardText">结果、设置、历史和</text>
    <text x="816" y="698" class="cardText">下一步动作在同页</text>
    <text x="816" y="740" class="tag" fill="#2563eb">设计：让生成不中断</text>

    <text x="1071" y="632" class="cardTitle">六类质量约束</text>
    <text x="1071" y="669" class="cardText">内容、主体、行业、</text>
    <text x="1071" y="698" class="cardText">营销、合规、续改</text>
    <text x="1071" y="740" class="tag" fill="#2563eb">设计：让质量可判断</text>

    <text x="1326" y="632" class="cardTitle">续改与复用枢纽</text>
    <text x="1326" y="669" class="cardText">再生成、扩图、抠图、</text>
    <text x="1326" y="698" class="cardText">转视频、保存资产</text>
    <text x="1326" y="740" class="tag" fill="#2563eb">设计：接住不满意</text>
  </g>

  <!-- emotion lines -->
  <g>
    <text x="72" y="486" class="text tag" fill="#c2410c">2.0 情绪曲线</text>
    <line x1="280" y1="500" x2="1520" y2="500" stroke="#fed7aa" stroke-width="2" stroke-dasharray="8 10"/>
    <polyline points="390,475 645,535 900,490 1155,548 1410,520" fill="none" stroke="url(#before)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff7ed" stroke="#fb923c" stroke-width="4">
      <circle cx="390" cy="475" r="16"/><circle cx="645" cy="535" r="16"/><circle cx="900" cy="490" r="16"/><circle cx="1155" cy="548" r="16"/><circle cx="1410" cy="520" r="16"/>
    </g>
    <text x="348" y="462" class="caption text">有期待</text>
    <text x="599" y="567" class="caption text">开始焦虑</text>
    <text x="854" y="477" class="caption text">短暂回升</text>
    <text x="1100" y="580" class="caption text">难判断</text>
    <text x="1360" y="552" class="caption text">链路断</text>

    <text x="72" y="838" class="text tag" fill="#1d4ed8">3.0 情绪曲线</text>
    <line x1="280" y1="852" x2="1520" y2="852" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="8 10"/>
    <polyline points="390,830 645,804 900,790 1155,782 1410,748" fill="none" stroke="url(#after)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#eff6ff" stroke="#2563eb" stroke-width="4">
      <circle cx="390" cy="830" r="16"/><circle cx="645" cy="804" r="16"/><circle cx="900" cy="790" r="16"/><circle cx="1155" cy="782" r="16"/><circle cx="1410" cy="748" r="16"/>
    </g>
    <text x="342" y="819" class="caption text">明确入口</text>
    <text x="594" y="793" class="caption text">表达变轻</text>
    <text x="850" y="779" class="caption text">上下文保留</text>
    <text x="1104" y="771" class="caption text">质量可说清</text>
    <text x="1358" y="737" class="caption text">可续改交付</text>
  </g>

  <rect x="72" y="910" width="1448" height="56" rx="22" fill="#101828"/>
  <text x="796" y="947" text-anchor="middle" class="title" font-size="24" fill="#ffffff">一句话结论：2.0 是用户在工具之间找路；3.0 是 Agent 沿着营销任务带用户往前走。</text>
</svg>
