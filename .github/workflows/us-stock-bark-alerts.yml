name: US Stock MA Signals (Bark)

on:
  # UTC checks; Python enforces 16:30–17:10 America/New_York,
  # so daylight saving time is handled without manual cron edits.
  schedule:
    - cron: '37,52 20,21 * * 1-5'
    - cron: '7 21,22 * * 1-5'
  workflow_dispatch:
    inputs:
      test_bark:
        description: 'Only send a Bark test notification'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Log signals without sending or saving'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: us-stock-bark-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/us-stock-bark-alerts/requirements.txt
      - name: Install Python dependencies
        run: pip install -r tools/us-stock-bark-alerts/requirements.txt
      - name: Calculate crossovers and push Bark messages
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          TEST_BARK: ${{ inputs.test_bark }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRIGGER: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then ARGS+=(--manual); fi
          if [[ "$TEST_BARK" == "true" ]]; then ARGS=(--test-bark); fi
          if [[ "$DRY_RUN" == "true" && "$TEST_BARK" != "true" ]]; then ARGS+=(--dry-run); fi
          python tools/us-stock-bark-alerts/monitor.py "${ARGS[@]}"
      - name: Save successfully sent signal keys
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true && inputs.test_bark != true
        shell: bash
        run: |
          set -euo pipefail
          FILE=tools/us-stock-bark-alerts/state.json
          if git diff --quiet -- "$FILE"; then
            echo 'No new state'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          git commit -m 'chore: remember delivered stock signals [skip ci]'
          git push
